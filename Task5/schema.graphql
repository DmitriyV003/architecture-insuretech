"""Клиент. В REST — GET /clients/{id} плюс отдельные под-ресурсы."""
type Client {
  "Идентификатор клиента."
  id: ID!

  "ФИО клиента."
  name: String

  "Возраст клиента."
  age: Int

  """
  Документы клиента. Эквивалент GET /clients/{id}/documents.
  Вложенное поле — можно получить вместе с клиентом одним запросом.
  """
  documents: [Document!]!

  """
  Родственники клиента. Эквивалент GET /clients/{id}/relatives.
  Вложенное поле — можно получить вместе с клиентом одним запросом.
  """
  relatives: [Relative!]!
}

"""Документ клиента. Definition Document из Swagger."""
type Document {
  "Идентификатор документа."
  id: ID!

  "Тип документа (паспорт, ВУ и т.п.)."
  type: String

  "Номер документа."
  number: String

  "Дата выдачи (в Swagger — string; при желании заменить на кастомный scalar Date)."
  issueDate: String

  "Дата окончания действия."
  expiryDate: String
}

"""Родственник клиента. Definition Relative из Swagger."""
type Relative {
  "Идентификатор записи о родственнике."
  id: ID!

  "Тип родства."
  relationType: String

  "ФИО родственника."
  name: String

  "Возраст родственника."
  age: Int
}

type Query {
  """
  Клиент по ID. Эквивалент GET /clients/{id}.
  Через вложенные поля documents/relatives одним запросом покрывает и под-ресурсы —
  потребитель сам выбирает нужный набор полей.
  """
  client(id: ID!): Client

  """
  Документы клиента напрямую. Эквивалент GET /clients/{id}/documents.
  Удобно, когда нужны только документы, без остальной карточки клиента.
  """
  clientDocuments(clientId: ID!): [Document!]!

  """
  Родственники клиента напрямую. Эквивалент GET /clients/{id}/relatives.
  Удобно, когда нужны только родственники.
  """
  clientRelatives(clientId: ID!): [Relative!]!
}

# Текущий REST-контракт содержит только операции чтения (GET), поэтому определён
# лишь тип Query. Mutation добавляется, когда появятся операции изменения
# (редактирование данных клиента в личном кабинете).
